<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso especial ♡</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, serif;
    overflow: hidden;
    background:
        radial-gradient(circle at 20% 20%, #ff8fc7 0 4%, transparent 5%),
        radial-gradient(circle at 80% 15%, #ffd35c 0 3%, transparent 4%),
        linear-gradient(135deg, #ff3f91, #d90072, #ff6b9f);
    color: #5b1640;
}

.decoracion {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.elemento {
    position: absolute;
    font-size: 30px;
    animation: flotar 4s ease-in-out infinite;
}

.e1 { top: 7%; left: 8%; }
.e2 { top: 12%; right: 10%; animation-delay: .7s; }
.e3 { top: 28%; left: 5%; animation-delay: 1.2s; }
.e4 { top: 24%; right: 5%; animation-delay: 1.8s; }
.e5 { bottom: 15%; left: 8%; animation-delay: .5s; }
.e6 { bottom: 10%; right: 9%; animation-delay: 1.4s; }
.e7 { bottom: 25%; left: 18%; animation-delay: 2s; }
.e8 { top: 42%; right: 15%; animation-delay: 2.5s; }
.e9 { top: 16%; left: 2%; font-size: 34px; animation-delay: 1s; }
.e10 { top: 33%; right: 1%; font-size: 34px; animation-delay: 2.2s; }
.e11 { top: 50%; left: 2%; font-size: 25px; animation-delay: 1.6s; }
.e12 { bottom: 5%; right: 1%; font-size: 34px; animation-delay: .8s; }
.e13 { top: 5%; right: 35%; font-size: 25px; animation-delay: 1.8s; }
.e14 { bottom: 20%; right: 4%; font-size: 25px; animation-delay: 2.7s; }
.e15 { bottom: 5%; left: 2%; font-size: 35px; animation-delay: 1.3s; }
.e16 { top: 32%; left: 8%; font-size: 24px; animation-delay: 3s; }

@keyframes flotar {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-10px) rotate(4deg); }
}

.contenedor {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.tarjeta {
    width: 100%;
    max-width: 390px;
    padding: 35px 25px;
    text-align: center;
    background: #fff5df;
    border: 5px solid #7b164d;
    border-radius: 28px;
    box-shadow:
        0 15px 35px rgba(70, 0, 40, .35),
        inset 0 0 0 3px #f2b15d;
    position: relative;
}

.tarjeta::before,
.tarjeta::after {
    content: "✦";
    position: absolute;
    color: #d73b79;
    font-size: 28px;
}

.tarjeta::before {
    top: 10px;
    left: 15px;
}

.tarjeta::after {
    bottom: 10px;
    right: 15px;
}

.osito {
    font-size: 58px;
    margin-bottom: 5px;
    animation: osito 2.5s ease-in-out infinite;
}

@keyframes osito {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg) scale(1.04); }
}

h1 {
    margin: 5px 0 10px;
    font-size: 27px;
    color: #a51b58;
    letter-spacing: 1px;
}

.subtitulo {
    font-size: 17px;
    margin-bottom: 25px;
    color: #70405a;
}

label {
    display: block;
    text-align: left;
    margin: 12px 5px 6px;
    font-weight: bold;
    color: #7b164d;
}

input {
    width: 100%;
    padding: 14px;
    border: 2px solid #e28aaf;
    border-radius: 14px;
    background: #fffaf1;
    color: #5b1640;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #c21d69;
    box-shadow: 0 0 0 3px rgba(194,29,105,.15);
}

button {
    margin-top: 24px;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 18px;
    background: #c71968;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 0 #7b164d;
    transition: .2s;
}

button:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #7b164d;
}

#error {
    min-height: 28px;
    margin-top: 17px;
    color: #b51c55;
    font-weight: bold;
    font-size: 14px;
}

.firma {
    margin-top: 22px;
    font-size: 13px;
    color: #9b6680;
}
</style>
</head>

<body>

<div class="decoracion">

    <div class="elemento e1">🎈</div>
    <div class="elemento e2">⭐</div>
    <div class="elemento e3">🎁</div>
    <div class="elemento e4">🎈</div>
    <div class="elemento e5">✨</div>
    <div class="elemento e6">🎂</div>
    <div class="elemento e7">🎁</div>
    <div class="elemento e8">⭐</div>

    <div class="elemento e9">🐄</div>
    <div class="elemento e10">🎁</div>
    <div class="elemento e11">🌸</div>
    <div class="elemento e12">🐄</div>
    <div class="elemento e13">🎀</div>
    <div class="elemento e14">✨</div>
    <div class="elemento e15">🎁</div>
    <div class="elemento e16">🌷</div>

</div>

<div class="contenedor">

    <div class="tarjeta">

        <div class="osito">🧸💐</div>

        <h1>✨ACCESO UNICO✨</h1>

        <div class="subtitulo">
            Una sorpresa tan solo para ti.
        </div>

        <label for="nombre">Nombre y tus dos apellidos</label>
        <input
            id="nombre"
            type="text"
            placeholder="Escribe tu nombre"
            autocomplete="off"
        >

        <label for="fecha">Fecha especial</label>
        <input
            id="fecha"
            type="text"
            placeholder="Escribe la fecha..."
            autocomplete="off"
        >

        <button onclick="entrar()">ENTRAR ♡</button>

        <div id="error"></div>

        <div class="firma">
            Una sorpresa hecha para tu ♡
        </div>

    </div>

</div>

<script>
let intentos = 0;

function entrar() {

    const nombre = document.getElementById("nombre").value.trim().toLowerCase();
    const fecha = document.getElementById("fecha").value.trim();

    const nombreCorrecto =
        nombre.includes("conzuelo") &&
        nombre.includes("ardiles") &&
        nombre.includes("tapia");

    const fechaCorrecta =
        fecha.replace(/\s/g, "") === "17092002";

            <div style="
                min-height:100vh;

                color:white;

            <style>
    .flowers-container > div[style*="position:absolute"] {
        animation: flowerDance 3.5s ease-in-out infinite;

        animation-duration:4.5s;
    }

    .flowers-container > div:nth-child(3n) {
        animation-duration:5.5s;
    }

    @keyframes flowerDance {
        0%,100% {
            transform:rotate(-6deg) scale(1);
        }

        50% {
            transform:rotate(6deg) scale(1.15);
        }
    }
</style>

<div class="flowers-container" style="
    position:relative;

    min-height:500px;
    display:flex;
    justify-content:center;

">

    <div class="flower" style="position:absolute;top:0;left:-5px;font-size:55px;">🌺</div>
<div style="position:absolute;top:5px;left:75px;font-size:38px;">🌸</div>

<div style="position:absolute;top:100px;right:-10px;font-size:55px;">🌺</div>

<div style="position:absolute;top:180px;left:-20px;font-size:58px;">💐</div>
<div style="position:absolute;top:175px;left:60px;font-size:38px;">🌸</div>
<div style="position:absolute;top:185px;right:60px;font-size:40px;">🌷</div>
<div style="position:absolute;top:170px;right:-15px;font-size:60px;">🌹</div>

<div style="position:absolute;bottom:80px;left:-5px;font-size:50px;">🌻</div>
<div style="position:absolute;bottom:55px;left:70px;font-size:35px;">🌼</div>
<div style="position:absolute;bottom:65px;right:65px;font-size:42px;">🪻</div>
<div style="position:absolute;bottom:45px;right:-5px;font-size:58px;">🌺</div>

<div style="position:absolute;bottom:0;left:25px;font-size:58px;">🌷</div>
<div style="position:absolute;bottom:5px;left:105px;font-size:40px;">🌸</div>
<div style="position:absolute;bottom:0;right:100px;font-size:42px;">💐</div>
<div style="position:absolute;bottom:-5px;right:20px;font-size:60px;">🌻</div>

    <div style="
        position:relative;
        z-index:5;
        text-align:center;
        padding:20px;
    ">

        <h1 style="
            margin:0;
            color:white;
            font-size:clamp(42px,12vw,72px);
            line-height:1.05;
            font-weight:bold;
            text-shadow:
                0 0 5px white,
                0 0 15px white,
                0 0 30px #ff4fa3,
                0 0 50px #ff4fa3;
        ">
            FELIZ<br>
            CUMPLEAÑOS,<br>
            PRINCESITA ♡
        </h1>

        <p style="
            margin-top:25px;
            color:white;
            font-size:20px;
            text-shadow:0 0 12px #ff4fa3;
        ">
            JEJEJEJE esto es para ti. ♡
        </p>

    </div>

</div>
                </div>
            </div>
        `;

    } else {

        intentos++;

            const mensajes = [
    "Por la patria que le dicen 🇨🇱. 🥹💕",
    "Cumpleaños de la doctora flora en bichos? 🐜👀",
    "Tu cumpleaño po Otelo. 🥺💗"
];

        document.getElementById("error").textContent =
    mensajes[Math.min(intentos - 1, 2)];
    }
}
    function siguiente() {
    document.body.innerHTML = `
        <div style="
            min-height:100vh;
            background:linear-gradient(180deg,#18051a,#4a0b45);
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;
            padding:30px;
            font-family:Georgia,serif;
        ">
            <div style="max-width:500px;">
                <div style="font-size:65px;">💐✨💐</div>

                <h1 style="font-size:30px;">
                    UNAS PALABRAS PARA TI ♡
                </h1>

                <p style="font-size:18px;line-height:1.6;">
                    Hay personas que quisieron dejarte
                    un pedacito de cariño en este día.
                </p>

                <button onclick="cartas()" style="
                    margin-top:20px;
                    padding:15px 28px;
                    border:none;
                    border-radius:30px;
                    background:#ff4fa3;
                    color:white;
                    font-size:17px;
                    font-weight:bold;
                ">
                    ABRIR LAS CARTAS ♡
                </button>
            </div>
        </div>
    `;
    }
    function cartas() {
    document.body.innerHTML = `
        <div style="
            min-height:100vh;
            background:#f7e6c5;
            color:#3b1738;
            padding:30px 15px;

            text-align:center;
        ">

            <h1 style="font-size:28px;">
                💌 PALABRAS PARA TI 💌
            </h1>

            <p style="font-size:17px;">
                Hay un montón de cariño esperándote...
            </p>

            <div style="
                display:flex;

                </div>

    }
</script>

</body>
</html>
